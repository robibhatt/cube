experiment_type: TrainMLP
trainer_config:
    trainer_type: Trainer
    mlp_config:
        input_dim: 20
        output_dim: 1
        hidden_dims:
        - 256
        - 256
        - 256
        start_activation: false
        end_activation: false
    optimizer_config:
        lr: 0.02
        weight_decay: 0.0
    cube_distribution_config:
        distribution_type: CubeDistribution
        input_dim: 20
        indices_list:
        - [0, 1, 2, 3]
        weights:
        - 1.0
        normalize: false
        noise_mean: 0.0
        noise_std: 0.0
    train_size: 10000
    test_size: 10000
    batch_size: 128
    epochs: 3000
    use_full_batch: false
    weight_decay_l1: 0.001
home_directory: experiment_runs/feature_learning_case/1
seed: 1
edge_thresholds:
- 1.0e-05
- 0.0001
- 0.001
- 0.01
- 0.1
